<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loki-PrintServer</title>
  <link rel="icon" type="image/png" href="/assets/icon_32.png">
  <link rel="apple-touch-icon" href="/assets/icon_128.png">
  <style>
    :root {
      --bg: #0a0f1e;
      --surface: #0d1529;
      --border: #1a2e4a;
      --accent: #00bfa5;
      --accent2: #1e90ff;
      --text: #e8f4f8;
      --muted: #5a7a9a;
      --success: #00e5a0;
      --warning: #f0a030;
      --danger: #e05060;
      --card: #111e35;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
    header {
      background: linear-gradient(135deg, #0a1628 0%, #0d2040 50%, #0a1a35 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex; align-items: center; gap: 16px;
    }
    .logo {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: bold; color: white;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.5px; }
    header span { color: var(--muted); font-size: 0.85rem; margin-left: 8px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); margin-left: auto;
      box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.5 } }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    .stat-card .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--accent2); margin-top: 6px; }
    .stat-card .sub { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
    section { margin-bottom: 32px; }
    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; color: var(--accent2); display: flex; align-items: center; gap: 8px; }
    .device-list { display: flex; flex-direction: column; gap: 10px; }
    .device-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px 20px;
      display: flex; align-items: center; gap: 16px;
      transition: border-color 0.2s;
    }
    .device-card:hover { border-color: var(--accent); }
    .device-icon {
      width: 40px; height: 40px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .device-info { flex: 1; }
    .device-name { font-weight: 600; font-size: 0.95rem; }
    .device-meta { color: var(--muted); font-size: 0.8rem; margin-top: 3px; font-family: monospace; }
    .badge {
      padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
    }
    .badge-shared { background: rgba(76,175,125,0.15); color: var(--success); border: 1px solid rgba(76,175,125,0.3); }
    .badge-idle { background: rgba(136,136,153,0.15); color: var(--muted); border: 1px solid rgba(136,136,153,0.3); }
    .btn {
      padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 0.85rem; font-weight: 600; transition: all 0.2s;
    }
    .btn-share { background: var(--accent); color: #0a0f1e; font-weight: 700; }
    .btn-share:hover { background: var(--accent2); color: white; transform: translateY(-1px); }
    .btn-unshare { background: rgba(224,80,80,0.15); color: var(--danger); border: 1px solid rgba(224,80,80,0.3); }
    .btn-unshare:hover { background: rgba(224,80,80,0.25); }
    .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 0.9rem; }
    .refresh-btn {
      margin-left: auto; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer; font-size: 0.8rem;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent2); }
    .device-card.infra {
      opacity: 0.45;
      border-style: dashed;
    }
    .device-card.infra:hover { opacity: 0.65; border-color: var(--border); }
    .infra-header {
      font-size: 0.78rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: 1px; margin: 20px 0 8px; display: flex; align-items: center; gap: 8px;
    }
    .infra-header::before { content: ''; flex: 1; height: 1px; background: var(--border); }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 24px; border-top: 1px solid var(--border); }
    footer a { color: var(--accent2); text-decoration: none; }
    .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; background: var(--card); border: 1px solid var(--success); color: var(--success); font-size: 0.85rem; transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 100; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .auto-share-toggle { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .auto-share-toggle input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
    .auto-share-toggle.active { color: var(--accent); }
    .device-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  </style>
</head>
<body>
  <header>
    <img src="/assets/icon_64.png" alt="Loki" style="width:44px;height:44px;border-radius:10px;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div style="display:none;width:44px;height:44px;background:var(--accent);border-radius:10px;align-items:center;justify-content:center;font-weight:bold;color:#0a0f1e;font-size:20px">L</div>
    <div>
      <h1>Loki-PrintServer <span id="version">v1.0.0</span></h1>
    </div>
    <div class="status-dot" id="statusDot" title="Server running"></div>
  </header>

  <main>
    <div class="grid">
      <div class="stat-card">
        <div class="label">USB Devices</div>
        <div class="value" id="statDevices">-</div>
        <div class="sub">connected</div>
      </div>
      <div class="stat-card">
        <div class="label">Shared</div>
        <div class="value" id="statShared">-</div>
        <div class="sub">actively shared</div>
      </div>
      <div class="stat-card">
        <div class="label">CPU</div>
        <div class="value" id="statCpu">-</div>
        <div class="sub">percent usage</div>
      </div>
      <div class="stat-card">
        <div class="label">Memory</div>
        <div class="value" id="statMem">-</div>
        <div class="sub">MB used</div>
      </div>
    </div>

    <section>
      <h2>
        🔌 USB Devices
        <button class="refresh-btn" onclick="loadDevices()">↻ Refresh</button>
      </h2>
      <div class="device-list" id="deviceList">
        <div class="empty">Loading devices...</div>
      </div>
      <details id="infraSection" style="display:none;margin-top:8px;">
        <summary>
          <div class="infra-header">▸ USB Infrastructure (Hubs &amp; Controllers)</div>
        </summary>
        <div class="device-list" id="infraList"></div>
      </details>
    </section>
  </main>

  <footer>
    <p><a href="https://github.com/YOUR_USERNAME/loki-printserver" target="_blank">Loki-PrintServer</a> — by <strong>BangerTECH</strong></p>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    const API = '';

    function showToast(msg, ok = true) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.borderColor = ok ? 'var(--success)' : 'var(--danger)';
      t.style.color = ok ? 'var(--success)' : 'var(--danger)';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    const DEVICE_ICONS = {
      'Printer': '🖨️', 'Mass Storage': '💾', 'Hub': '🔗',
      'HID': '⌨️', 'Communications': '📡', 'Image': '📷',
      'Vendor Specific': '🔧', 'Device': '🔌',
      'Cutting Plotter / Serial': '✂️',
      'Cutting Plotter': '✂️',
      'Graphtec': '✂️', 'Silhouette': '✂️', 'Cricut': '✂️', 'Roland DG': '✂️',
      'Audio': '🔊', 'Video': '🎥', 'Wireless Controller': '📶',
    };

    async function loadStatus() {
      try {
        const r = await fetch(`${API}/api/status`);
        const s = await r.json();
        document.getElementById('statCpu').textContent = s.cpu_percent.toFixed(0) + '%';
        document.getElementById('statMem').textContent = s.memory_used_mb;
        document.getElementById('statShared').textContent = s.shared_device_count;
      } catch(e) {
        document.getElementById('statusDot').style.background = 'var(--danger)';
      }
    }

    function renderDevice(d, isInfra = false) {
      const icon = DEVICE_ICONS[d.device_class] || (isInfra ? '🔗' : '🔌');
      const name = d.product || `Device ${d.vendor_id}:${d.product_id}`;
      const mfr = d.manufacturer ? `${d.manufacturer} · ` : '';
      const fi = d.forward_info || {};
      const autoShare = fi.auto_share || false;
      const badge = d.is_shared
        ? `<span class="badge badge-shared">● Shared</span>`
        : `<span class="badge badge-idle">${isInfra ? 'Infrastructure' : 'Idle'}</span>`;
      const actions = isInfra ? '' : (d.is_shared
        ? `<div class="device-actions">
            <label class="auto-share-toggle ${autoShare ? 'active' : ''}" title="Re-share automatically after server restart">
              <input type="checkbox" ${autoShare ? 'checked' : ''} onchange="toggleAutoShare('${d.bus_id}', this.checked)">
              Auto-Share
            </label>
            <button class="btn btn-unshare" onclick="unshareDevice('${d.bus_id}')">Stop Sharing</button>
           </div>`
        : `<div class="device-actions">
            <button class="btn btn-share" onclick="shareDevice('${d.bus_id}')">Share</button>
           </div>`);
      return `
        <div class="device-card${isInfra ? ' infra' : ''}">
          <div class="device-icon">${icon}</div>
          <div class="device-info">
            <div class="device-name">${name}</div>
            <div class="device-meta">${mfr}${d.vendor_id}:${d.product_id} · Bus ${d.bus_id} · ${d.device_class || 'Unknown'}</div>
          </div>
          ${badge}
          ${actions}
        </div>`;
    }

    async function loadDevices() {
      const list = document.getElementById('deviceList');
      const infraList = document.getElementById('infraList');
      const infraSection = document.getElementById('infraSection');
      try {
        const r = await fetch(`${API}/api/devices`);
        const devices = await r.json();

        const peripherals = devices.filter(d => !d.is_infrastructure);
        const infra = devices.filter(d => d.is_infrastructure);

        document.getElementById('statDevices').textContent = peripherals.length;

        if (peripherals.length === 0) {
          list.innerHTML = '<div class="empty">No USB devices detected</div>';
        } else {
          list.innerHTML = peripherals.map(d => renderDevice(d, false)).join('');
        }

        if (infra.length > 0) {
          infraSection.style.display = '';
          infraList.innerHTML = infra.map(d => renderDevice(d, true)).join('');
        } else {
          infraSection.style.display = 'none';
        }
      } catch(e) {
        list.innerHTML = '<div class="empty">Failed to load devices</div>';
      }
    }

    async function shareDevice(busId) {
      try {
        const r = await fetch(`${API}/api/devices/share`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bus_id: busId }),
        });
        const j = await r.json();
        showToast(j.message || `Device ${busId} shared`);
        setTimeout(loadDevices, 500);
      } catch(e) {
        showToast('Failed to share device', false);
      }
    }

    async function toggleAutoShare(busId, enabled) {
      try {
        await fetch(`${API}/api/devices/${busId}/auto-share?enabled=${enabled}`, { method: 'POST' });
        showToast(enabled ? '⏰ Auto-Share enabled — device will be shared on restart' : 'Auto-Share disabled');
        setTimeout(loadDevices, 300);
      } catch(e) {
        showToast('Failed to update Auto-Share', false);
      }
    }

    async function unshareDevice(busId) {
      try {
        const r = await fetch(`${API}/api/devices/unshare`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bus_id: busId }),
        });
        const j = await r.json();
        showToast(j.message || `Device ${busId} stopped`);
        setTimeout(loadDevices, 500);
      } catch(e) {
        showToast('Failed to unshare device', false);
      }
    }

    // WebSocket for real-time updates
    function connectWS() {
      const ws = new WebSocket(`ws://${location.host}/ws`);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (['device_shared', 'device_unshared'].includes(msg.event)) {
          loadDevices();
          loadStatus();
        }
      };
      ws.onclose = () => setTimeout(connectWS, 3000);
      setInterval(() => ws.readyState === 1 && ws.send('ping'), 30000);
    }

    loadStatus();
    loadDevices();
    connectWS();
    setInterval(() => { loadStatus(); }, 5000);
  </script>
</body>
</html>
