name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-server:
    name: Lint & Test Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r server/api/requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check server/api/

      - name: Run tests
        run: pytest tests/server/ -v --tb=short || true

  lint-client:
    name: Lint & Test Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r client/requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check client/

      - name: Run tests
        run: pytest tests/client/ -v --tb=short || true

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: lint-server
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (ARM support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          platforms: linux/arm64,linux/amd64
          push: false
          tags: loki-printserver:test

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [lint-server, lint-client, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=$(cat VERSION 2>/dev/null || echo '1.0.0')" >> $GITHUB_OUTPUT

      - name: Package client
        run: |
          cd client
          zip -r ../loki-client-${{ steps.version.outputs.VERSION }}.zip . \
            --exclude "*.pyc" --exclude "__pycache__/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: loki-client-${{ steps.version.outputs.VERSION }}
          path: loki-client-*.zip
